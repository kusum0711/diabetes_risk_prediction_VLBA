# Tells Grafana to load any dashboard JSON found under /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: diabetes-dashboards
    orgId: 1
    folder: "Diabetes MLOps"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
