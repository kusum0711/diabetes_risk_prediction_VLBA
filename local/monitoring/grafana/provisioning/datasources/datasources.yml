# Auto-provisions the Prometheus datasource so Grafana is ready on first boot.
# The fixed uid lets the provisioned dashboard reference it reliably.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      # Match Prometheus' scrape_interval so Grafana uses a tight query step
      # (otherwise range-query panels lag behind freshly scraped samples).
      timeInterval: "5s"
      httpMethod: POST
