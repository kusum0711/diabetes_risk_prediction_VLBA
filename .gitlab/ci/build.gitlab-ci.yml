build-images:
  stage: build-images
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache make
    - echo "Logging in to Docker registry..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Building app image ${CI_IMAGE}..."
    - make build-image
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "Pushing ${CI_IMAGE}..."
        make push-image
        echo "No registry credentials — skipping push (local build)."
      fi

