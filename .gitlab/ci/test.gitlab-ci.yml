variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

lint:
  stage: test
  image: python:3.10-slim
  cache:
    key:
      prefix: lint-pip
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - pip install flake8
  script:
    - echo "Running flake8 lint checks..."
    - python -m flake8 src --max-line-length=120
    - echo "Lint checks passed."

test:
  stage: test
  image: python:3.10-slim
  cache:
    key:
      prefix: test-pip
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - pip install -r requirements.txt
  script:
    - echo "Running test suite in parallel (race mode)..."
    - python -m pytest src/tests -n auto
    - echo "Tests completed."
